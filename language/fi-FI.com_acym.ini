ACYM_WHAT_ARE_SEGMENTS="Mitä ovat segmentit?"
ACYM_WHAT_ARE_SEGMENTS_DESC="Segmentoimalla sähköpostisi voit jakaa tietokantasi ja luoda listoja eri kriteerien mukaan.<br /> Segmentoinnin avulla voit mukauttaa sisältösi erityyppisten käyttäjien mukaan.<br />Voit segmentoida asiakkaasi profiilin mukaan. Voit valita, millä kriteereillä ryhmittelet listasi.<br />Nämä kriteerit voivat perustua luomiisi mukautettuihin kenttiin ja moniin muihin suodattimiin (tilastot, tilaukset, ostot...)"
ACYM_WHY_USE_SEGMENTS="Miksi käyttää segmenttejä?"
ACYM_WHY_USE_SEGMENTS_DESC="<b>Segmenttien avulla tavoitat oikean kohderyhmän oikeaan aikaan sähköpostikampanjoissasi.</b><br />Kaksi tärkeintä syytä segmentoida sähköposteja:<br /><b>- Paranna avausprosenttia</b><br />Asiakkaasi klikkaavat sisältöä todennäköisemmin, kun se on räätälöity heidän tarpeisiinsa ja käyttäytymiseensä.<br /><b>- Luo ja personoi asiakassuhde</b><br />Asiakassegmentoinnin avulla voit luoda aidon asiakassuhteen tekemällä yksilöllisiä ja kohdennettuja kampanjoita kunkin käyttäjän profiilin ja mieltymysten mukaan.<br />Segmentointi luo asiakaspolun sähköpostikampanjasi kautta."
ACYM_SUMMARY_NUMBER_RECEIVERS_DESC="Tämä on kaikkien tähän kampanjaan linkitettyjen listojen ja segmenttien tilaaneiden käyttäjien määrä. Jotkut käyttäjät voivat olla tilattuja useille listoille, mutta heidät lasketaan vain kerran tähän kokonaismäärään."
ACYM_YOUR_CUSTOM_SEGMENT="Oma segmenttisi"
ACYM_CONDITIONS_DESC="Automaatio käynnistyy vain, jos valitsemasi ehdot täyttyvät. Näiden ehtojen ei välttämättä tarvitse koskea tilaajia, joihin toimenpiteitä sovelletaan."
ACYM_REQUIRED_DESC="Mukautettu kenttä on pakollinen, kun se näkyy tilauslomakkeessa. Tämä vaihtoehto ei ole aktiivinen sivustosi järjestelmänvalvojan osassa."
ACYM_AUTO_SEND_PROCESS_DESC="Sähköpostien lähettäminen vie aikaa, älä lisää lähetettyjen sähköpostien määrää per erä liikaa tai palvelimesi ei pysy perässä."
ACYM_UPLOAD_FOLDER_DESC="Kansio, johon liitteet ladataan. Voit käyttää lyhytkoodeja, kuten {groupname} tai {userid}, saadaksesi tietyn kansion käyttäjäryhmää/käyttäjää kohden."
ACYM_ALLOWED_FILES_DESC="Tätä rajoitusta sovelletaan, kun yritetään ladata tiedostoja AcyMailing-muodossa, kuten liitteitä tai kuvia editorissa tai tiedostojen mukautetussa kentässä."
ACYM_CLICK_HERE_TO_CREATE="Luo sellainen napsauttamalla tätä"
ACYM_DELETE_DETAILED_STATS_AFTER_DESC="Yksityiskohtaiset tilastot näyttävät sinulle, ketkä tilaajat avasivat sähköpostit, napsautivat niissä olevia linkkejä, peruuttivat niiden tilauksen tai palauttivat palautusviestin."
ACYM_TRACKINGSYSTEM_EXTERNAL_LINKS_DESC="Kun lisäät linkkejä sähköposteihisi, voit seurata verkkosivustosi ulkopuolelle johtavien linkkien napsautuksia."
ACYM_TRACKINGSYSTEM_GA_DESC="Kun klikkauksia seurataan Google Analyticsin avulla, parametrit utm_campaign, utm_medium ja utm_source lisätään lähettämiesi sähköpostien linkkeihin."
ACYM_TRACKINGSYSTEM_ACY_DESC="Kun klikkauksia seurataan AcyMailing:lla, lähettämiesi sähköpostien linkit korvataan siirtymälinkillä, joka ohjaa alkuperäiseen linkkiin."
ACYM_CONNECTION_METHOD_DESC="Suosittelemme IMAP-yhteyttä, mutta tarkista palautusosoitteen tarjoajan dokumentaatio varmistaaksesi."
ACYM_BOUNCE_PORT_DESC="Voit jättää tämän kentän tyhjäksi, jos et tiedä mitä käyttää. Useimmissa tapauksissa se on 993 IMAP:lle ja 995 POP3:lle, kun käytetään suojattua yhteyttä, tai 143 IMAP:lle ja 110 POP3:lle."
ACYM_AUTOMATED_TASKS_DESC="Aktivoi tämä vaihtoehto ottaaksesi käyttöön automatisoidut tehtävät, kuten lähetysprosessin, automatisoinnin, palautuksen käsittelyn, päivittäiset tehtävät jne."
ACYM_ALLOW_MODIFICATION_DESC="Jos &quot;Kyllä&quot; on valittu, kuka tahansa voi muokata tilaus- ja mukautettuja kenttiä kirjoittamalla sähköpostiosoitteen tilauslomakkeeseen. Käytä sitä vain, kun tilaajillasi ei välttämättä ole tiliä verkkosivustollasi."
ACYM_REQUIRE_CONFIRMATION_DESC="Jos tämä vaihtoehto on käytössä, uudet käyttäjät saavat sähköpostin, jossa heitä pyydetään vahvistamaan sähköpostiosoitteensa. Tätä vahvistusta ei enää tarvita, jos käyttäjä tilaa muita listoja myöhemmin"
