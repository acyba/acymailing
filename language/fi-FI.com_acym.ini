ACYM_WHAT_IS_BOUNCE_HANDLING_TEXT="Tämä kuvake kuvaa palautusviestien käsittelyä parhaiten.<br />Tiedät luultavasti jo, mistä on kyse. &quot;Toimituksen tilailmoitus (epäonnistui)&quot; on varmasti tuttu?<br />Lyhyesti: sähköpostin lähettämisen jälkeen saat joskus viestin, joka kertoo, ettei viestiä toimitettu jostakin syystä.<br />Loma-/automaattivastaus, vastaanottajan sähköpostipalvelimen estämä viesti, olematon vastaanottajan sähköpostiosoite ja niin edelleen..."
