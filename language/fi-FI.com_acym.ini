ACYM_LIST_UNSUBSCRIBE_HANDLING_DESC="AcyMailing voi lisätä tilauksen peruutusotsakkeen lähetettyihin sähköposteihin, jotta käyttäjät voivat helposti perua tilauksen ja jotta sinua ei pidettäisi roskapostin lähettäjänä. Tämä lähettää sinulle sähköpostin 'Peru käyttäjän ID xxx tilaus'. Tämä palautussääntö käsittelee tämäntyyppiset sähköpostit automaattisesti, joten sinun ei tarvitse perua käyttäjien tilauksia käsin."
ACYM_SUPPRESSION_LIST_DESC="Tämä sääntö käsittelee automaattisesti Amazon SES:n vastauksen, kun sähköpostin lähetys estyy, koska käyttäjä on estolistalla. Oletusarvoisesti tämä sääntö poistaa käyttäjän automaattisesti listalta."
ACYM_ACTION_REQUIRED_DESC="Tämä sääntö suoritetaan viesteille, jotka vaativat toimenpiteitä sinulta. Tällaiset viestit on käsiteltävä käsin; voit välittää ne sivuston ylläpitäjälle ja käsitellä ne yksitellen. Oletusarvoisesti tämä sääntö käsittelee automaattivastaukset, kuten 'vahvista olevasi ihminen napsauttamalla tästä' tai 'vastaa tähän uutiskirjeeseen ja jätä aiherivi ennalleen'."
ACYM_ACKNOWLEDGMENT_RECEIPT_SUBJECT_DESC="Tämä sääntö poistaa aiheriviltä ilmoitusviestit, kuten 'Olen lomalla' tai 'kiitos viestistäsi'. Oletuksena nämä vain ohitetaan. Tunnistus perustuu vain aiheriviin."
ACYM_FEEDBACK_LOOP_DESC="Tämä sääntö käsittelee palautesilmukkavalituksia."
ACYM_FEEDBACK_LOOP_BODY_DESC="Tämä sääntö käsittelee palautesilmukkavalituksia, kun viesti sijaitsee palautusviestin tekstiosassa."
ACYM_MAILBOX_FULL_DESC="Tämä sääntö käsittelee toimittamatta jääneet viestit, koska vastaanottajan postilaatikko on täynnä. Oletuksena emme halua välittömästi estää tätä käyttäjää. AcyMailing odottaa kolmea pehmeää palautusviestiä ennen kuin ryhtyy toimiin tälle tilaajalle."
ACYM_BLOCKED_GOOGLE_GROUPS_DESC="Tämä sääntö käsittelee Google Groupsin estosta johtuvat palautusviestit."
ACYM_REJECTED_DESC="Tämä sääntö käsittelee vastaanottajan palvelimen hylkäämiä viestejä."
ACYM_MAILBOX_DOESNT_EXIST_1_DESC="Tämä sääntö käsittelee palautusviestejä, jotka osoittavat, että postilaatikkoon ei saada yhteyttä, koska sitä ei ole olemassa."
ACYM_MESSAGE_BLOCKED_RECIPIENTS_DESC="Tämä sääntö käsittelee viestejä, joita ei voitu toimittaa, koska suodatin esti viestisi. Oletusarvoisesti Acymailing välittää sinulle nämä viestit, jotta voit tutkia ongelmaa."
ACYM_MAILBOX_DOESNT_EXIST_2_DESC="Tämä sääntö käsittelee palautusviestejä, jotka osoittavat, että postilaatikkoon ei saada yhteyttä, koska sitä ei ole olemassa. Molemmat säännöt ovat välttämättömiä useimpien tämäntyyppisten palautusviestien kattamiseksi."
ACYM_DOMAIN_NOT_EXIST_DESC="Tämä sääntö käsittelee palautusviestit, jotka ilmoittavat, ettei postilaatikkoon saada yhteyttä, koska verkkotunnusta ei ole olemassa. Postilaatikkoa tai vastaanottajan verkkotunnusta ei ole olemassa, joten oletuksena estämme yhteydenotot tähän käyttäjään välittömästi."
ACYM_TEMPORARY_FAILURES_DESC="Tämä sääntö käsittelee muut pehmeät palautukset, kuten vastaanottajan postilaatikon tilapäisen poissaolon. Oletuksena AcyMailing ryhtyy toimiin tilaajalle vasta, jos tältä käyttäjältä vastaanotetaan vähintään 3 pehmeää palautusta."
ACYM_FAILED_PERM_DESC="Tämä sääntö käsittelee niin sanotut 'pysyvät palautukset'. Se käsittelee viestit, joita emme saaneet kiinni aiemmilla säännöillä 'Postilaatikkoa ei ole olemassa' ja 'Verkkotunnusta ei ole olemassa'."
ACYM_ACKNOWLEDGMENT_RECEIPT_BODY_DESC="Tämä sääntö poistaa ilmoitusviestit, kuten 'kiitos yhteydenotostasi...', jos ne sisältyvät palautusviestin tekstiosaan. Tunnistus perustuu vain viestin sisältöön."
ACYM_FINAL_RULE_DESC="Tämä sääntö suoritetaan, jos viesti ei vastaa mitään aiemmista säännöistä. Oletusarvoisesti tällainen viesti ohjataan sähköpostiosoitteeseesi, jotta voit käsitellä sen manuaalisesti tai parantaa sääntöjä sen käsittelemiseksi automaattisesti."
