ACYM_SPECIAL_CHARS_DESC="Jos otat tämän vaihtoehdon käyttöön, sähköpostin muototarkistukset ovat vähemmän rajoittavia ja sallivat esimerkiksi kyrilliset, heprean tai kiinalaiset merkit."
ACYM_SMTP_SECURE_DESC="Jos valitsit portin 465, valitse SSL. Jos valitsit portin 587, valitse TLS. Jos kyseessä on jokin muu portti, jätä tämä vaihtoehto tyhjäksi."
ACYM_SMTP_PORT_DESC="Portti on yleensä 465 tai 587. Katso valitsemasi lähetyspalvelun SMTP-dokumentaatio. Napsauta alla olevaa linkkiä varmistaaksesi, että palvelimesi sallii tarvitsemasi portin."
