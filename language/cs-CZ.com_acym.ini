ACYM_WHAT_IS_BOUNCE_HANDLING="Co je to zpracování nedoručitelných e-mailů?"
ACYM_WHAT_IS_BOUNCE_HANDLING_TEXT="Tato ikona nejlépe ilustruje proces nedoručitelnosti. <br />Ve skutečnosti už víte, o co se jedná. „Oznámení o stavu doručení (neúspěšné)“ – znáte to, že? <br />Zkrátka, někdy po odeslání e-mailu obdržíte zprávu, že vaše zpráva nebyla z nějakého důvodu doručena. <br />Zpráva o dovolené/automatická odpověď, váš e-mail byl blokován e-mailovým serverem příjemce, e-mailová adresa příjemce neexistuje atd."
ACYM_WHAT_ARE_THE_RISKS_BOUNCES="Jaká jsou rizika?"
ACYM_WHAT_ARE_THE_RISKS_BOUNCES_TEXT="Poštovní servery vás začnou považovat za SPAM, protože dostáváte příliš mnoho nedoručitelných e-mailů. <br />Pokud to neoptimalizujete, vaše e-maily již nebudou doručovány. Je to tak jednoduché!"
ACYM_HOW_ACYMAILING_CAN_HELP="Jak vám může AcyMailing pomoci?"
ACYM_HOW_ACYMAILING_CAN_HELP_TEXT="Funkce zpracování nedoručitelných e-mailů umožňuje zastavit odesílání e-mailů neplatným příjemcům a zastavit přijímání odražených e-mailů, aby nebyly považovány za SPAM. <br />Zde je několik akcí, které budete moci definovat:<br /> - Odstranit uživatele z vašich příjemců, pokud jeho e-mailová adresa neexistuje <br /> - Přeposlat zprávu na vaši e-mailovou adresu, pokud se jedná o zprávu o dovolené/automatickou odpověď <br /> - Odhlásit uživatele ze seznamu <br /> - A mnoho dalších ..."
