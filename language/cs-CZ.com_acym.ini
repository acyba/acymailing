ACYM_AUTO_LOGIN_DESCRIPTION_WARNING="Automaticky přihlaste uživatele, když kliknou na odkazy obsahu, aby jej otevřeli na vašem webu. To je užitečné pro obsah s omezeným přístupem, ale mějte na paměti, že vaši příjemci mohou e-mail přeposlat a tím &quot;sdílet&quot; přístup ke svému účtu."
ACYM_MIGRATE_WARNING_DATA_OVERWRITE="Pokud se rozhodnete migrovat stará data AcyMailing (verze 5.X), budou data nového rozšíření AcyMailing přepsána. Ujistěte se, že neztratíte žádná důležitá data uložená ve vaší nové instanci AcyMailing."
