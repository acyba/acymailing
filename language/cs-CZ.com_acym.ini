ACYM_WHAT_ARE_SEGMENTS="Co jsou segmenty?"
ACYM_WHAT_ARE_SEGMENTS_DESC="Segmentace e-mailů umožňuje rozdělit vaši databázi a vytvořit seznamy podle různých kritérií.<br /> Segmentace vám umožňuje přizpůsobit obsah různým typům uživatelů. <br />Můžete segmentovat podle profilu zákazníků. Je na vás, podle jakých kritérií budete seznam segmentovat.<br />Tato kritéria mohou být založena na libovolných vlastních polích, která jste vytvořili, a na mnoha dalších filtrech (statistiky, předplatná, nákupy...)"
ACYM_WHY_USE_SEGMENTS="Proč používat segmenty?"
ACYM_WHY_USE_SEGMENTS_DESC="<b>Segmenty umožňují oslovit správnou cílovou skupinu ve správný čas v rámci vašich e-mailových kampaní.</b><br />Dva hlavní důvody pro segmentaci e-mailů:<br /><b>- Zlepšení míry otevření</b><br />Vaši zákazníci budou s větší pravděpodobností klikat na váš obsah, pokud bude přizpůsoben jejich potřebám a chování. <br /><b>- Vytvoření/personalizace vztahu se zákazníkem</b><br />Segmentace zákazníků vám umožňuje vytvořit skutečný vztah se zákazníkem tím, že vytváříte jedinečné a cílené kampaně podle profilu a preferencí každého uživatele.<br />Segmentace vytváří cestu zákazníka vaší e-mailovou kampaní."
ACYM_SUMMARY_NUMBER_RECEIVERS_DESC="Toto je počet všech uživatelů přihlášených k odběru seznamů a segmentů spojených s touto kampaní. Někteří uživatelé mohou být přihlášeni k odběru několika seznamů, ale v tomto součtu jsou započítáni pouze jednou."
ACYM_YOUR_CUSTOM_SEGMENT="Váš vlastní segment"
ACYM_CONDITIONS_DESC="Automatizace se spustí pouze v případě, že budou splněny podmínky, které vyberete. Tyto podmínky se nemusí nutně týkat odběratelů, na které budou akce aplikovány."
ACYM_REQUIRED_DESC="Vlastní pole bude povinné, pokud se zobrazí v přihlašovacím formuláři. Tato možnost není aktivní v administrační části vašeho webu."
ACYM_AUTO_SEND_PROCESS_DESC="Odesílání e-mailů trvá určitou dobu, proto příliš nezvyšujte počet odesílaných e-mailů v jedné dávce, jinak váš server nebude schopen stíhat."
ACYM_UPLOAD_FOLDER_DESC="Složka, do které budou nahrány přílohy. Můžete použít zkrácené kódy jako {groupname} nebo {userid}, abyste měli konkrétní složku pro každou skupinu uživatelů / uživatele."
ACYM_ALLOWED_FILES_DESC="Toto omezení se použije při pokusu o nahrání souborů do AcyMailingu, jako jsou přílohy nebo obrázky v editoru nebo vlastní pole souboru."
ACYM_CLICK_HERE_TO_CREATE="Klikněte zde pro vytvoření"
ACYM_DELETE_DETAILED_STATS_AFTER_DESC="Podrobné statistiky vám ukazují, kteří odběratelé otevřeli e-maily, klikli na odkazy v nich, odhlásili se z odběru nebo vrátili e-mail jako nedoručitelný."
ACYM_TRACKINGSYSTEM_EXTERNAL_LINKS_DESC="Při vkládání odkazů do e-mailů můžete zvolit sledování kliknutí na odkazy směřující mimo vaši webovou stránku."
ACYM_TRACKINGSYSTEM_GA_DESC="Při sledování kliknutí pomocí Google Analytics budou k odkazům v e-mailech, které odesíláte, přidány parametry utm_campaign, utm_medium a utm_source."
ACYM_TRACKINGSYSTEM_ACY_DESC="Při sledování kliknutí pomocí AcyMailingu budou odkazy v e-mailech, které odesíláte, nahrazeny přechodovým odkazem, který přesměruje na původní odkaz."
ACYM_CONNECTION_METHOD_DESC="Doporučujeme připojení IMAP, ale pro jistotu si zkontrolujte dokumentaci poskytovatele adresy pro nedoručitelné e-maily."
ACYM_BOUNCE_PORT_DESC="Pokud nevíte, co použít, můžete toto pole nechat prázdné. Ve většině případů to bude 993 pro IMAP a 995 pro POP3 při použití zabezpečeného připojení, nebo 143 pro IMAP a 110 pro POP3."
ACYM_AUTOMATED_TASKS_DESC="Aktivujte tuto možnost, abyste povolili automatizované úkoly, jako je proces odesílání, automatizace, zpracování nedoručitelných zpráv, denní úkoly atd."
ACYM_ALLOW_MODIFICATION_DESC="Pokud je vybrána možnost &quot;Ano&quot;, bude moci kdokoli upravit přihlášení k odběru a vlastní pole zadáním e-mailové adresy do přihlašovacího formuláře. Používejte tuto možnost pouze v případě, že vaši odběratelé nemusí mít nutně účet na vašem webu."
ACYM_REQUIRE_CONFIRMATION_DESC="Pokud je tato možnost aktivována, noví uživatelé obdrží e-mail s žádostí o potvrzení své e-mailové adresy. Toto potvrzení již není nutné, pokud se uživatel později přihlásí k odběru jiných seznamů."
ACYM_DAILY_TASKS_DESC="Denní úkoly mohou být automatizace spouštěné jednou denně, denní sledování, e-maily k narozeninám..."
ACYM_SPECIAL_CHARS_DESC="Pokud tuto možnost aktivujete, kontrola formátu e-mailu bude méně přísná a umožní například použití cyrilice, hebrejských nebo čínských znaků."
ACYM_SMTP_SECURE_DESC="Pokud jste zvolili port 465, vyberte SSL. Pokud jste zvolili port 587, vyberte TLS. Pro jakýkoli jiný port nechte tuto možnost prázdnou."
ACYM_SMTP_PORT_DESC="Port je obvykle 465 nebo 587, podívejte se do dokumentace SMTP odesílací služby, kterou jste vybrali. Klikněte na odkaz níže a ujistěte se, že váš hosting povoluje port, který potřebujete."
ACYM_SMTP_PASSWORD_DESC="Obvykle se jedná o heslo vaší e-mailové adresy nebo API klíč poskytnutý odesílací službou, kterou jste vybrali."
ACYM_SMTP_USERNAME_DESC="Obvykle se jedná o e-mailovou adresu nebo uživatelské jméno poskytnuté odesílací službou, kterou jste si vybrali."
ACYM_SMTP_AUTHENTICATION_DESC="Aktivujte tuto možnost, pokud vaše odesílací služba vyžaduje zadání uživatelského jména a hesla pro odesílání e-mailů."
ACYM_SMTP_ALIVE_DESC="Pokud je tato možnost deaktivována, AcyMailing se mezi odesláním jednotlivých e-mailů odpojí od vámi zvolené odesílací služby. Pokud to vaše odesílací služba umožňuje, je lepší nechat tuto možnost aktivní."
ACYM_SMTP_SERVICE="Externí služba (SMTP)"
ACYM_PHPMAIL_FUNCTION="Váš server (PHP Mail Function)"
ACYM_BOUNCE_ADDRESS_DESC="Někdy se stane, že e-maily nedorazí příjemci (e-mailová adresa neexistuje, schránka je plná atd.). V takovém případě je na vaši &quot;E-mailovou adresu odesílatele&quot; zaslán informační e-mail, ale pomocí této možnosti můžete vybrat jinou e-mailovou adresu, na kterou bude tato zpráva zaslána."
ACYM_ADD_NAMES_DESC="Pokud tuto možnost vypnete, vaši odběratelé uvidí ve svých poštovních klientech pouze vaši e-mailovou adresu, když od vás obdrží e-mail."
ACYM_REPLYTO_DESC="Informace v poli &quot;Odpovědět na&quot; se mohou lišit od informací v poli &quot;Odesílatel&quot;. Pokud odběratel klikne na tlačítko &quot;Odpovědět&quot; ve svém poštovním klientovi, odešle e-mail na adresu &quot;Odpovědět na&quot;, kterou jste zadali, namísto adresy &quot;Od&quot;."
ACYM_FROM_DESC="Toto se zobrazuje nad vašimi e-maily, když je odběratelé obdrží. Pomáhá jim to zjistit, kdo jim e-mail poslal."
ACYM_COULD_NOT_RETRIEVE_DATA="Nelze načíst data"
ACYM_COPY_SETTINGS_FROM="Zkopírovat nastavení z %s"
ACYM_SECURITY_KEY_DESC="Pokud používáte předplatné přes URL a chcete povolit captcha, budete muset přidat tento bezpečnostní klíč do svého předplatného přes URL (přidáním argumentu seckey=VÁŠ_KLÍČ), jinak předplatné přes URL nebude fungovat. Tento klíč je náhodně generován během instalačního procesu, ale můžete jej změnit, budete-li chtít."
ACYM_SEE_USERS="Zobrazit uživatele"
