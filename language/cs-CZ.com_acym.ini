ACYM_CANNOT_DELETE_FINAL_RULE="Konečné pravidlo nelze smazat"
ACYM_LIST_UNSUBSCRIBE_HANDLING_DESC="AcyMailing může přidat hlavičku &quot;Odhlásit se z odběru&quot; do odeslaných e-mailů, aby se uživatelé mohli snadno odhlásit a zabránilo se tak tomu, že budete považováni za odesílatele spamu. Tím se vám odešle e-mail &quot;Odhlaste prosím uživatele ID xxx&quot;. Toto pravidlo pro nedoručitelné e-maily automaticky zpracuje tento typ e-mailů, takže nemusíte uživatele odhlašovat ručně."
ACYM_SUPPRESSION_LIST_DESC="Toto pravidlo automaticky zpracuje odpověď Amazon SES, když je odeslání e-mailu zamítnuto z důvodu, že uživatel je na seznamu potlačených adresátů. Ve výchozím nastavení toto pravidlo automaticky deaktivuje tohoto uživatele z vašeho seznamu."
ACYM_ACTION_REQUIRED_DESC="Toto pravidlo se spustí u zpráv, které vyžadují vaši akci. Tento typ zpráv je třeba zpracovat ručně, můžete je přeposlat webmasterovi a spravovat je jednotlivě. Ve výchozím nastavení toto pravidlo zpracuje všechny automatické odpovědi typu 'klikněte zde pro potvrzení, že jste člověk' nebo 'odpovězte na tento newsletter a ponechte předmět zprávy beze změny'."
ACYM_ACKNOWLEDGMENT_RECEIPT_SUBJECT_DESC="Toto pravidlo odstraní z předmětu zprávy oznámení typu 'Jsem na dovolené' nebo 'Děkuji za vaši zprávu'. Ve výchozím nastavení je chceme jednoduše ignorovat. Budou detekovány pouze na základě předmětu zprávy."
ACYM_FEEDBACK_LOOP_DESC="Toto pravidlo bude zpracovávat stížnosti na zpětnou vazbu."
ACYM_FEEDBACK_LOOP_BODY_DESC="Toto pravidlo bude zpracovávat stížnosti na zpětnou vazbu, pokud se zpráva nachází v těle e-mailu s oznámením o nedoručení."
ACYM_MAILBOX_FULL_DESC="Toto pravidlo bude zpracovávat nedoručené zprávy z důvodu přeplnění schránky příjemce. Ve výchozím nastavení nechceme tohoto uživatele okamžitě blokovat. AcyMailing počká na 3 zprávy o měkkém odražení, než podnikne kroky vůči tomuto odběrateli."
ACYM_BLOCKED_GOOGLE_GROUPS_DESC="Toto pravidlo bude zpracovávat nedoručitelné zprávy způsobené blokováním Google Groups"
ACYM_REJECTED_DESC="Toto pravidlo bude zpracovávat zprávy odmítnuté serverem příjemce."
ACYM_MAILBOX_DOESNT_EXIST_1_DESC="Toto pravidlo bude zpracovávat zprávy o nedoručitelnosti indikující, že poštovní schránka nebyla dostupná, protože neexistuje."
ACYM_MESSAGE_BLOCKED_RECIPIENTS_DESC="Toto pravidlo bude zpracovávat zprávy, které nemohly být doručeny, protože vaše zpráva byla zablokována filtrem. Ve výchozím nastavení vám Acymailing tyto zprávy přepošle, abyste mohli problém prošetřit."
ACYM_MAILBOX_DOESNT_EXIST_2_DESC="Toto pravidlo bude zpracovávat zprávy o nedoručitelnosti, které označují, že poštovní schránka nebyla dostupná, protože neexistuje. Obě pravidla jsou nezbytná k pokrytí většiny zpráv o nedoručení tohoto typu."
ACYM_DOMAIN_NOT_EXIST_DESC="Toto pravidlo bude zpracovávat zprávy o nedoručitelnosti, které označují, že poštovní schránka nebyla dostupná, protože doménové jméno neexistuje. Poštovní schránka nebo doména příjemce neexistuje, ve výchozím nastavení dojde k okamžitému zablokování dalšího kontaktování uživatele."
ACYM_TEMPORARY_FAILURES_DESC="Toto pravidlo bude zpracovávat další měkká odražení, jako je dočasná nedostupnost poštovní schránky příjemce. Ve výchozím nastavení AcyMailing podnikne kroky vůči odběrateli pouze v případě, že od tohoto uživatele obdrží alespoň 3 takovéto zprávy."
ACYM_FAILED_PERM_DESC="Toto pravidlo bude zpracovávat tzv. 'hard bounce' zprávy. Bude zpracovávat zprávy, které jsme nemohli zachytit pomocí předchozích pravidel 'Poštovní schránka neexistuje' a 'Doména neexistuje'"
ACYM_ACKNOWLEDGMENT_RECEIPT_BODY_DESC="Toto pravidlo odstraní oznámení, jako je 'děkujeme za kontakt...', pokud jsou obsažena v těle e-mailu o nedoručitelnosti. Bude detekováno pouze na základě těla e-mailu."
ACYM_FINAL_RULE_DESC="Toto pravidlo se provede, pokud zpráva neodpovídá žádnému z předchozích pravidel. Ve výchozím nastavení se tento typ zprávy přesměruje na vaši e-mailovou adresu, abyste ji mohli ručně zpracovat nebo vylepšit pravidla pro její automatické zpracování."
